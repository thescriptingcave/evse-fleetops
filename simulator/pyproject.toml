[project]
name = "evse-simulator"
version = "0.1.0"
description = "EVSE telemetry simulator for EVSE FleetOps"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]